
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake - Endless Adventure</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #101820, #182b38);
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.container {
    text-align: center;
    width: 100%;
    max-width: 480px;
}

h1 {
    color: #00ff88;
    margin-bottom: 15px;
    font-size: 32px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.stat {
    background: #243744;
    padding: 12px 5px;
    border-radius: 10px;
}

.stat span {
    display: block;
    color: #00ff88;
    font-size: 22px;
    font-weight: bold;
    margin-top: 5px;
}

select, button {
    padding: 11px 15px;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    cursor: pointer;
    margin: 5px;
}

select {
    background: #243744;
    color: white;
}

button {
    background: #00ff88;
    color: #101820;
    font-weight: bold;
}

button:hover {
    background: #00cc70;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #14232e;
    border: 3px solid #00ff88;
    border-radius: 10px;
    margin: 10px auto;
}

#message {
    color: #00ff88;
    min-height: 25px;
    margin: 10px;
}

.controls {
    margin-top: 10px;
}

.controls button {
    width: 55px;
    height: 45px;
    font-size: 20px;
    padding: 5px;
}

</style>
</head>

<body>

<div class="container">

<h1>🐍 Snake Adventure</h1>

<div class="stats">
    <div class="stat">
        Score
        <span id="score">0</span>
    </div>

    <div class="stat">
        Level
        <span id="level">1</span>
    </div>

    <div class="stat">
        Best
        <span id="best">0</span>
    </div>
</div>

<select id="difficulty" onchange="changeDifficulty()">
    <option value="easy">Easy Mode</option>
    <option value="medium" selected>Medium Mode</option>
    <option value="hard">Hard Mode</option>
</select>

<canvas id="game" width="400" height="400"></canvas>

<p id="message">Eat food and grow! There is no final level.</p>

<div>
    <button onclick="togglePause()" id="pauseBtn">Pause</button>
    <button onclick="restartGame()">Restart</button>
</div>

<p style="margin-top:12px;color:#aaa">
    Arrow Keys / WASD to move | Space to pause
</p>

<div class="controls">
    <div>
        <button onclick="changeDirection('UP')">⬆️</button>
    </div>
    <div>
        <button onclick="changeDirection('LEFT')">⬅️</button>
        <button onclick="changeDirection('DOWN')">⬇️</button>
        <button onclick="changeDirection('RIGHT')">➡️</button>
    </div>
</div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;
const size = 20;

let snake, food, direction, nextDirection;
let score, level, speed, timer;
let paused = false;
let gameOver = false;
let difficulty = "medium";

let best = Number(localStorage.getItem("snakeBest")) || 0;
document.getElementById("best").textContent = best;

const speeds = {
    easy: 180,
    medium: 120,
    hard: 75
};

function restartGame() {
    clearInterval(timer);

    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";

    score = 0;
    level = 1;
    speed = speeds[difficulty];

    paused = false;
    gameOver = false;

    document.getElementById("pauseBtn").textContent = "Pause";
    document.getElementById("message").textContent =
        "Eat food and grow! There is no final level.";

    updateStats();
    generateFood();
    draw();

    timer = setInterval(gameLoop, speed);
}

function updateStats() {
    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = level;
    document.getElementById("best").textContent = best;
}

function generateFood() {
    do {
        food = {
            x: Math.floor(Math.random() * size),
            y: Math.floor(Math.random() * size)
        };
    } while (snake.some(p =>
        p.x === food.x && p.y === food.y
    ));
}

function changeDirection(newDirection) {
    if (gameOver || paused) return;

    const opposite = {
        UP: "DOWN",
        DOWN: "UP",
        LEFT: "RIGHT",
        RIGHT: "LEFT"
    };

    if (newDirection !== opposite[direction]) {
        nextDirection = newDirection;
    }
}

document.addEventListener("keydown", e => {
    const keys = {
        ArrowUp: "UP",
        w: "UP",
        ArrowDown: "DOWN",
        s: "DOWN",
        ArrowLeft: "LEFT",
        a: "LEFT",
        ArrowRight: "RIGHT",
        d: "RIGHT"
    };

    if (keys[e.key]) {
        e.preventDefault();
        changeDirection(keys[e.key]);
    }

    if (e.code === "Space") {
        e.preventDefault();
        togglePause();
    }
});

function gameLoop() {
    if (paused || gameOver) return;

    direction = nextDirection;

    let head = {...snake[0]};

    if (direction === "UP") head.y--;
    if (direction === "DOWN") head.y++;
    if (direction === "LEFT") head.x--;
    if (direction === "RIGHT") head.x++;

    // Endless screen: wrap around the edges
    head.x = (head.x + size) % size;
    head.y = (head.y + size) % size;

    const ate = head.x === food.x && head.y === food.y;

    // Self collision
    const body = ate ? snake : snake.slice(0, -1);

    if (body.some(p =>
        p.x === head.x && p.y === head.y
    )) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (ate) {
        score += 10;

        // New level every 50 points
        let newLevel = Math.floor(score / 50) + 1;

        if (newLevel > level) {
            level = newLevel;
            document.getElementById("message").textContent =
                "🎉 LEVEL " + level + "! Keep going!";
            
            updateSpeed();
        }

        generateFood();

        if (score > best) {
            best = score;
            localStorage.setItem("snakeBest", best);
        }

    } else {
        snake.pop();
    }

    updateStats();
    draw();
}

function updateSpeed() {
    const base = speeds[difficulty];

    // Gradually increases speed, with a minimum delay
    speed = Math.max(45, base - (level - 1) * 7);

    clearInterval(timer);
    timer = setInterval(gameLoop, speed);
}

function draw() {
    ctx.fillStyle = "#14232e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = "#1c303d";
    ctx.lineWidth = 0.5;

    for (let i = 0; i <= size; i++) {
        ctx.beginPath();
        ctx.moveTo(i * box, 0);
        ctx.lineTo(i * box, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * box);
        ctx.lineTo(canvas.width, i * box);
        ctx.stroke();
    }

    // Food
    ctx.fillStyle = "#ff4757";
    ctx.beginPath();
    ctx.arc(
        food.x * box + box/2,
        food.y * box + box/2,
        box/2 - 2,
        0, Math.PI * 2
    );
    ctx.fill();

    // Snake
    snake.forEach((p, i) => {
        ctx.fillStyle = i === 0 ? "#00ff88" : "#00bb70";

        ctx.beginPath();
        ctx.roundRect(
            p.x * box + 1,
            p.y * box + 1,
            box - 2,
            box - 2,
            5
        );
        ctx.fill();
    });

    if (paused) {
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(0, 0, 400, 400);

        ctx.fillStyle = "white";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("PAUSED", 200, 200);
    }
}

function endGame() {
    gameOver = true;
    clearInterval(timer);

    document.getElementById("message").textContent =
        "💥 Game Over! Score: " + score +
        " | Press Restart to play again.";

    draw();
}

function togglePause() {
    if (gameOver) return;

    paused = !paused;

    document.getElementById("pauseBtn").textContent =
        paused ? "Resume" : "Pause";

    document.getElementById("message").textContent =
        paused ? "Game Paused" : "Keep playing!";

    draw();
}

function changeDifficulty() {
    difficulty = document.getElementById("difficulty").value;

    if (!gameOver) {
        speed = Math.max(
            45,
            speeds[difficulty] - (level - 1) * 7
        );

        clearInterval(timer);
        timer = setInterval(gameLoop, speed);
    }
}

restartGame();
</script>

</body>
</html>
